      <stop offset="0%" stop-color="#08172B"/>
      <stop offset="50%" stop-color="#10263F"/>
      <stop offset="100%" stop-color="#050D1A"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C92D4"/>
      <stop offset="100%" stop-color="#6CDDE9"/>
    </linearGradient>
  </defs>

  <!-- Background -->

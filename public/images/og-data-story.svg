    <rect width="64" height="64" rx="14" fill="#142E49" stroke="#294F69" stroke-width="2"/>
    <path d="M32 12L50 23V43L32 54L14 43V23L32 12Z" stroke="#6CDDE9" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="5" fill="#6CDDE9"/>
    <text x="84" y="44" fill="#EAF4FF" font-size="34" font-weight="800" font-family="sans-serif">LinkCube</text>
